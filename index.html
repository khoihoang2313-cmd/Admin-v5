<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UCHIHA V5 Admin</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#eee;font-family:Arial;display:grid;place-items:center;padding:18px}.card{width:100%;max-width:480px;background:#141414;border:1px solid #333;border-radius:18px;padding:22px}h1{text-align:center;letter-spacing:2px}p{color:#aaa;font-size:13px;line-height:1.5}input,button{width:100%;padding:13px;margin-top:10px;border-radius:9px;font-size:14px}input{background:#080808;color:white;border:1px solid #444}button{background:#eee;color:#111;border:0;font-weight:bold}li{margin:10px 0;overflow-wrap:anywhere}.item{border:1px solid #333;border-radius:10px;padding:10px;margin-top:10px}.item button{width:auto;padding:8px;margin-right:5px}.danger{background:#4b2020;color:white}.note{color:#e8c77a}</style></head><body><main class="card"><h1>UCHIHA V5 ADMIN</h1><p>Trang quản lý key demo. Tạo key tại đây rồi nhập key đó ở trang app.</p><input id="newkey" placeholder="Nhập key muốn tạo, ví dụ KHOI-001"><button id="create">TẠO KEY</button><p id="msg"></p><h3>Danh sách key</h3><div id="list"></div><p class="note">Lưu ý: bản này dùng localStorage, chỉ chia sẻ khi Admin và app cùng origin (cùng website). Không đồng bộ giữa thiết bị/trình duyệt khác và không phải hệ thống bảo mật máy chủ.</p><p><a href="index.html" style="color:white">Mở UCHIHA V5</a></p></main><script>const STORE='uchiha_v5_keys';function read(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){return []}}function save(a){localStorage.setItem(STORE,JSON.stringify(a))}function render(){const root=document.getElementById('list');root.innerHTML='';const a=read();if(!a.length){root.textContent='Chưa có key nào.';return}a.forEach((k,i)=>{const d=document.createElement('div');d.className='item';const title=document.createElement('b');title.textContent=k.key+' — '+(k.active===false?'ĐÃ TẮT':'ĐANG BẬT');d.appendChild(title);const toggle=document.createElement('button');toggle.textContent=k.active===false?'BẬT LẠI':'TẮT KEY';toggle.onclick=()=>{const x=read();x[i].active=x[i].active===false;save(x);render()};d.appendChild(toggle);const del=document.createElement('button');del.textContent='XÓA';del.className='danger';del.onclick=()=>{const x=read();x.splice(i,1);save(x);render()};d.appendChild(del);root.appendChild(d)})}document.getElementById('create').onclick=()=>{const input=document.getElementById('newkey');const key=input.value.trim();const msg=document.getElementById('msg');if(!key){msg.textContent='Hãy nhập key.';return}const a=read();if(a.some(x=>x.key===key)){msg.textContent='Key này đã tồn tại.';return}a.push({key,active:true,createdAt:new Date().toISOString()});save(a);input.value='';msg.textContent='Đã tạo key.';render()};render();</script></body></html>
